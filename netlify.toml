# example netlify.toml
[build]
  command = "pnpm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[edge_functions]]
  function = "summary-guard"
  path = "/api/summary"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "frame-ancestors 'self'; object-src 'none'; base-uri 'self'"

# 兼容旧 sitemap 地址，跳转到 @astrojs/sitemap 生成的索引文件
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
  force = true

# Netlify Image CDN：源图在 /images/*（即 public/images/*），对外用 /cdn-img/* 走转换与内容协商。
# 文章 Markdown 里写相对路径（相对 public/images/），构建时 remarkImageCdn 改写为 /cdn-img/<相对路径>；
# 本机 astro dev/preview 不经此重定向，直接静态访问 /images/*。
# 文档：https://docs.netlify.com/build/image-cdn/overview/
[[redirects]]
  from = "/cdn-img/*"
  to = "/.netlify/images?url=/images/:splat&w=1280&q=80"
  status = 200

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# /music 的默认演示音频（第三方版权内容，见 /music 页面的 LICENSE 区块）。
# 刻意使用无扩展名路径 + application/octet-stream：IDM 等下载管理器会依据
# `*.mp3` 扩展名或 `audio/*` 类型接管请求，导致页面 fetch 拿到空数据。
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/octet-stream"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/llms-small.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/posts/*.md"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

  ## Uncomment to use this redirect for Single Page Applications like create-react-app.
  ## Not needed for static site generators.
  #[[redirects]]
  #  from = "/*"
  #  to = "/index.html"
  #  status = 200

